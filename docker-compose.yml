# SiteTracker V1 — local development stack.
# Compose v2 format (no `version:` key).

services:
  db:
    image: postgres:16
    container_name: sitetracker-db
    environment:
      POSTGRES_USER: sitetracker
      # DEV-ONLY: this password protects the local Docker Postgres
      # container; production / staging will use a managed Postgres
      # provided by the hosting provider with its own credentials. The
      # value here is intentionally inline (no env_file) because the
      # local DB has no other source of truth and is recreated freely
      # via docker volume rm. See docs/operations/env-and-secrets.md.
      POSTGRES_PASSWORD: sitetracker
      POSTGRES_DB: sitetracker
    ports:
      # Host port 5433 → container 5432 to avoid clash with any native
      # Postgres install on the Windows host. The backend compose service
      # talks to the container over the internal network on 5432 regardless.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sitetracker-backend
    depends_on:
      db:
        condition: service_healthy
    # Prod-readiness Slice 1 / ADR 0002: secrets and environment vars
    # are loaded from backend/.env.development, which is gitignored and
    # created via: cp backend/.env.development.example backend/.env.development
    # If the file is missing, compose will exit with a clear error —
    # that's the documented setup step in docs/operations/env-and-secrets.md.
    env_file:
      - ./backend/.env.development
    environment:
      # Override only the DATABASE_URL: inside the compose network the
      # backend reaches Postgres at the internal hostname db:5432, not
      # the host-side mapping of localhost:5433. Everything else
      # (APP_ENV, JWT_SECRET, CORS_ALLOWED_ORIGINS) comes from env_file.
      DATABASE_URL: postgresql+asyncpg://sitetracker:sitetracker@db:5432/sitetracker
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot reload. The anonymous volume on /app/.venv
      # preserves the container-installed venv (Linux wheels) so the host's
      # Windows venv doesn't shadow it.
      - ./backend:/app
      - /app/.venv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

volumes:
  pgdata:
