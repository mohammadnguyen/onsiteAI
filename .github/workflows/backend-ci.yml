name: backend-ci

# Runs on every PR and on pushes to main. Mirrors the local verification:
# `ruff check app tests` + `python -m pytest -q` against a real Postgres 16,
# using uv + the committed uv.lock (same toolchain as backend/Dockerfile).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repository (no writes, no
# packages, no deployments).
permissions:
  contents: read

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The test suite connects to Postgres at localhost:5433/sitetracker_test
    # (hard-coded in backend/tests/conftest.py), so map the service's 5432 to
    # host 5433 and name the database sitetracker_test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitetracker
          POSTGRES_PASSWORD: sitetracker
          POSTGRES_DB: sitetracker_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sitetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sitetracker:sitetracker@localhost:5433/sitetracker_test
      # Throwaway CI-only secret (>=32 chars, non-placeholder) to satisfy the
      # non-dev config validator. NOT a real secret — only ever used against
      # the ephemeral CI Postgres above. Mirrors the committed conftest value.
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      CORS_ALLOWED_ORIGINS: https://localhost.test
      # Keep the auth rate limiter disabled in the suite (see conftest).
      AUTH_RATE_LIMIT_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run python -m pytest -q

      # Advisory only (non-blocking): surface known CVEs in the locked deps.
      # Hits PyPI's advisory DB, so a network/registry hiccup must not fail CI.
      - name: Dependency audit (advisory, non-blocking)
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --format requirements-txt \
            -o /tmp/backend-requirements.txt
          uvx pip-audit -r /tmp/backend-requirements.txt

  migrations:
    name: alembic round-trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Exercise the real migrations (the test suite builds the schema straight
    # from metadata and never runs Alembic). A fresh, dedicated Postgres so the
    # upgrade/downgrade round-trip starts from an empty database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitetracker
          POSTGRES_PASSWORD: sitetracker
          POSTGRES_DB: sitetracker_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sitetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Same config the test job uses; Alembic's env.py resolves the URL via
    # get_settings(), which requires these to pass the non-dev validator.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sitetracker:sitetracker@localhost:5433/sitetracker_test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      CORS_ALLOWED_ORIGINS: https://localhost.test
      AUTH_RATE_LIMIT_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      # A broken, missing, or non-reversible migration fails CI here.
      - name: Alembic round-trip (upgrade -> downgrade -> upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
