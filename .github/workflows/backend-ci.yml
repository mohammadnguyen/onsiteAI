name: backend-ci

# Runs on every PR and on pushes to main. Mirrors the local verification:
# `ruff check app tests` + `python -m pytest -q` against a real Postgres 16,
# using uv + the committed uv.lock (same toolchain as backend/Dockerfile).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root gate (L1): lint + the whole root test suite (drift-checker fixtures
  # AND the calibration-tooling path-policy tests) + the drift check itself.
  # Runs at the REPOSITORY ROOT — the drift check resolves docs/product/* and
  # its Binding Scope from there and hard-fails from any other working
  # directory, and the path-policy tests need `git worktree list` against the
  # real checkout. No DB required.
  #
  # Versions are pinned so a new upstream release cannot turn this gate red
  # (or silently green) on its own: ruff matches the version locked in
  # backend/uv.lock. NOTE: there is no ruff config at the repository root, so
  # this lint runs on ruff defaults, not backend/pyproject.toml's rule set.
  governance:
    name: root governance + calibration tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: pip install "pytest>=9,<10" "ruff==0.15.11"

      - name: Ruff (calibration tooling + root tests)
        run: ruff check evals/extraction/tools tests

      - name: Root test suite (drift fixtures + calibration path policy)
        run: python -m pytest tests/ -q

      - name: Decision drift check (full coverage)
        run: python scripts/check_decision_drift.py --require-full-coverage

  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The test suite connects to Postgres at localhost:5433/sitetracker_test
    # (hard-coded in backend/tests/conftest.py), so map the service's 5432 to
    # host 5433 and name the database sitetracker_test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitetracker
          POSTGRES_PASSWORD: sitetracker
          POSTGRES_DB: sitetracker_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sitetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sitetracker:sitetracker@localhost:5433/sitetracker_test
      # Throwaway CI-only secret (>=32 chars, non-placeholder) to satisfy the
      # non-dev config validator. NOT a real secret — only ever used against
      # the ephemeral CI Postgres above. Mirrors the committed conftest value.
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      CORS_ALLOWED_ORIGINS: https://localhost.test
      # Keep the auth rate limiter disabled in the suite (see conftest).
      AUTH_RATE_LIMIT_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pytest
        run: uv run python -m pytest -q
