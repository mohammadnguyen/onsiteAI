[project]
name = "backend"
version = "0.1.0"
description = "SiteTracker backend — internal cost control API for small residential builders."
authors = [
    { name = "SiteTracker Dev", email = "sitetracker-dev@local" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.1,<5",
    "boto3>=1.43.42",
    "email-validator>=2.3.0",
    "fastapi>=0.136.0",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.12.1",
    "python-multipart>=0.0.26",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.45.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop so that a session-scoped async engine fixture (see
# tests/conftest.py::_test_engine) uses the same event loop as individual
# function-scoped tests. Without this, asyncpg raises "attached to a
# different loop" when a test reuses a pooled connection from the engine.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Rules the project deliberately opts out of (not bugs):
#  - UP037: quoted annotations are load-bearing for SQLAlchemy ``Mapped["X"]``
#    and Pydantic forward refs whose targets are TYPE_CHECKING-only imports;
#    unquoting them breaks runtime mapper/model resolution.
#  - UP042: ``class X(str, Enum)`` -> ``StrEnum`` changes ``str(member)``
#    semantics; the native-enum mappings and audit serialization rely on the
#    current form.
#  - UP047: the existing ``TypeVar``-based generic response-strip helpers are
#    intentional and clear; PEP-695 syntax is not required.
ignore = ["UP037", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
# ``Depends(...)`` / ``Query(...)`` in argument defaults is the canonical
# FastAPI idiom, only used in the route handlers and the shared deps module.
"app/api/*.py" = ["B008"]
"app/deps.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]
