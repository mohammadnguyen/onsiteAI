# Fly.io configuration for the Forey Test backend.
#
# A SEPARATE app from the staging backend, which carries the operator's
# real business data. Deploying with this file cannot reach that app: the
# name below is the target, and `flyctl deploy --config fly.test.toml`
# refuses to run against a different one unless --app is given explicitly.
#
# Decision of record: docs/decisions/ADR-005-forey-test-app-variant.md.
# Operator steps: docs/operations/forey-test-backend.md. Nothing here has
# been created or deployed.
#
# APP_ENV=test on purpose. It is treated as a NON-development environment
# (a real JWT secret is required, no wildcard CORS) while still permitting
# the local evidence-storage adapter, which staging and production forbid.
# The adapter is given a persistent volume below; a Fly machine's own disk
# is not persistent.

app = "forey-test-api"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # A single machine owns the evidence volume, and it stays up: a stopped
  # machine cannot answer the phone on cellular.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[mounts]]
  source = "forey_test_evidence"
  destination = "/data/evidence"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
