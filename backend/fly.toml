# Fly.io configuration for the SiteTracker staging backend.
#
# Per ADR 0003 (docs/adr/0003-staging-deployment-strategy.md):
#   - Hosting target: Fly.io
#   - Region: Sydney (syd)
#   - App name: sitetracker-backend-staging
#   - HTTPS: provider-native LetsEncrypt
#   - Secrets: provider-native `flyctl secrets set` (NOT this file)
#   - Alembic migrations: MANUAL for V1 (no release_command below)
#   - Rollback: manual via `flyctl releases rollback`
#
# This config is consumed by `flyctl deploy --app
# sitetracker-backend-staging`, executed operator-side per
# docs/operations/staging-deploy.md gates.
#
# Slice 2-B1 (the doc batch this file ships in) does NOT execute any
# flyctl commands.

app = "sitetracker-backend-staging"
primary_region = "syd"

[build]
  # Uses backend/Dockerfile as-is (Python 3.12-slim + uv + frozen
  # install + EXPOSE 8000 + healthcheck on /healthz). No build args
  # needed; Slice 1's env-aware Settings reads everything at runtime
  # from flyctl-injected secrets.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Deliberately omitted in V1 (per ADR 0003):
#   - [deploy] release_command  → alembic is manual for V1 so the
#     first migration's output is observable.
#   - No [statics], no [mounts] — backend is stateless; persistent
#     state lives in the attached Fly Managed Postgres cluster.
#
# Attachment storage (Timeline module, PR 6+): photo objects live in a
# Tigris bucket, NOT on a volume (volumes are single-host NVMe with no
# replication — wrong home for long-lived evidence photos). DEPLOY
# ORDER MATTERS: run `fly storage create` (which injects
# AWS_ENDPOINT_URL_S3 / BUCKET_NAME / AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY as app secrets) BEFORE deploying any build that
# includes PR 6 — the non-dev settings validator refuses to boot the
# app if the four storage vars are missing, exactly like the JWT/CORS
# gates. The bucket MUST remain PRIVATE (never `--public`): downloads
# are served exclusively through short-lived presigned GET URLs, and a
# public bucket silently defeats that access model.
